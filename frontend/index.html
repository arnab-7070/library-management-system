<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The House of Books</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Libre+Caslon+Text:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Sign in / first-time setup -->
<main id="auth" class="auth" hidden>
  <form id="auth-form" class="auth-box">
    <h1>The House of Books</h1>
    <p id="auth-intro" class="muted"></p>
    <label>Librarian ID <input name="username" autocomplete="username" required></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <p id="auth-hint" class="muted small" hidden>At least 8 characters with an upper-case letter, a lower-case letter, a number and a symbol. No spaces.</p>
    <p id="auth-error" class="error" role="alert"></p>
    <button class="primary" id="auth-submit"></button>
  </form>
</main>

<!-- The app -->
<div id="app" class="app" hidden>
  <aside class="side">
    <div class="brand">The House of Books</div>
    <nav id="nav">
      <button data-view="dashboard" class="active">Dashboard</button>
      <button data-view="books">Books</button>
      <button data-view="users">Members</button>
      <button data-view="circulation">Issue &amp; return</button>
    </nav>
    <button id="signout" class="link">Sign out</button>
  </aside>

  <main class="content">
    <section id="view-dashboard">
      <h2>Dashboard</h2>
      <dl class="ledger" id="ledger"></dl>
      <h3>Out on loan</h3>
      <div id="dash-out"></div>
    </section>

    <section id="view-books" hidden>
      <h2>Books</h2>
      <form id="book-form" class="row">
        <label>Title <input name="title" required></label>
        <label>Author <input name="author" required></label>
        <label class="narrow">Price (₹) <input name="price" type="number" min="0" step="0.01" required></label>
        <label class="narrow">Copies <input name="quantity" type="number" min="1" value="1" required></label>
        <button class="primary">Add book</button>
      </form>
      <p class="muted small">Adding a title and author that already exist adds copies to the shelf.</p>
      <input id="book-search" class="search" type="search" placeholder="Search by title or author" aria-label="Search books">
      <div id="book-list"></div>
    </section>

    <section id="view-users" hidden>
      <h2>Members</h2>
      <form id="user-form" class="row">
        <label>Name <input name="name" required></label>
        <label>Phone number <input name="phone" inputmode="numeric" pattern="\d{10,15}" title="10 to 15 digits" required></label>
        <button class="primary">Add member</button>
      </form>
      <div id="user-list"></div>
    </section>

    <section id="view-circulation" hidden>
      <h2>Issue &amp; return</h2>
      <form id="issue-form" class="row">
        <label>Member <select name="userId" id="issue-user" required></select></label>
        <label>Book <select name="bookId" id="issue-book" required></select></label>
        <label class="narrow">Copies <input name="quantity" type="number" min="1" value="1" required></label>
        <button class="primary">Issue book</button>
      </form>
      <div class="tabs" id="loan-filter">
        <button data-status="active" class="active">Out now</button>
        <button data-status="all">All history</button>
      </div>
      <div id="loan-list"></div>
    </section>
  </main>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
